name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Teko
      fonts:
        - asset: assets/fonts/Teko-Regular.ttf

    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf

    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf

    - family: Nosifer
      fonts:
        - asset: assets/fonts/Nosifer-Regular.ttf

    - family: VinaSans
      fonts:
        - asset: assets/fonts/VinaSans-Regular.ttf

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf

