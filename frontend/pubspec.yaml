name: frontend
description: "Active Sport Gym es una aplicación móvil para la gestión de un gimnasio, que permite a los usuarios registrarse, iniciar sesión, ver y reservar clases, acceder a su historial de entrenamiento y recibir notificaciones sobre eventos y promociones."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0 # <--- NUEVO: pantalla de inicio (logo + color al abrir la app)

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Teko
      fonts:
        - asset: assets/fonts/Teko-Regular.ttf

    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf

    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf

    - family: Nosifer
      fonts:
        - asset: assets/fonts/Nosifer-Regular.ttf

    - family: VinaSans
      fonts:
        - asset: assets/fonts/VinaSans-Regular.ttf

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icono.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/icono.jpg"

# NUEVO: pantalla que se ve al abrir la app (color de fondo + logo)
flutter_native_splash:
  color: "#000000"
  image: "assets/images/logo.png"
  android_12:
    color: "#000000"
    image: "assets/images/icono_splash.png"